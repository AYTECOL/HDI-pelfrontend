service: poliza-express-hogar-front # NOTE: update this with your service name
#service: ebonds-front-V5

provider:
  name: aws
  runtime: nodejs8.10
  #stage: nonprod #dev,nonprod,prod
  stage: dev #dev,nonprod,prod
  region: us-east-1
  account: {Ref: "AWS::AccountId"}
  iamRoleStatements:
        - Effect: "Allow"
          Action:
            - s3:PutItem
            - s3:List*
          Resource: arn:aws:s3:::${self:custom.s3Bucket}/*

custom:
  #s3Bucket: cumplimiento-uatv4
  s3Bucket: poliza-express-hogar-front

functions:
  hello:
    handler: handler.hello

# you can add CloudFormation resource templates here

resources:
  Resources:
    ## Specifying the S3 Bucket
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html
    ## Specifying the policies to make sure all files inside the Bucket are avaialble to CloudFront
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              #Principal: "*"
              #Principal: {"Fn::Join" : [" ",["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", { Ref: WebsiteOriginAccessIdentity } ] ] }
              Principal: {"Fn::Join" : [" ",["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", { Ref: WebsiteOriginAccessIdentity } ] ] }
              CanonicalUser:
                    {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
                    #Fn::Join : [" ",["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", { Ref: WebsiteOriginAccessIdentity } ] ] 
              Action:
              - s3:GetObject
              - s3:PutObject
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
            #- Sid: 2
            #  Effect: Allow
            #  Principal: "*"
              #Principal: {"Fn::Join" : [" ",["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", { Ref: WebsiteOriginAccessIdentity } ] ] }
              #Principal:
                 #CanonicalUser:
                    #{"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
                  #Fn::Join : [" ",["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity", { Ref: WebsiteOriginAccessIdentity } ] ] 
            #  Action:
            #  - s3:PutObject
            #  Resource: arn:aws:s3:::${self:custom.s3Bucket}/*     
    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}"          
    ## Specifying the CloudFront Distribution to server your Web Application
    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              #DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              ## An identifier for the origin which must be unique within the distribution
              Id: WebApp
 #             CustomOriginConfig:
 #               HTTPPort: 80
 #               HTTPSPort: 443
 #               OriginProtocolPolicy: https-only
              ## In case you want to restrict the bucket access use S3OriginConfig and remove CustomOriginConfig
              S3OriginConfig:
                 OriginAccessIdentity: { "Fn::Join" : ["",["origin-access-identity/cloudfront/", {Ref: WebsiteOriginAccessIdentity } ] ] }
          Enabled: 'true'
          ## Uncomment the following section in case you are using a custom domain
          Aliases:
           #- cumplimiento-uat.libertyseguros.co #---> uat
           - hogar.libertyseguros.co
          DefaultRootObject: index.html
          ## Since the Single Page App is taking care of the routing we need to make sure ever path is served with index.html
          ## The only exception are files that actually exist e.h. app.js, reset.css
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
             ## The origin id defined above
            TargetOriginId: WebApp
            ## Defining if and how the QueryString and Cookies are forwarded to the origin which in this case is S3
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ## The protocol that users can use to access the files in the origin. To allow HTTP use `allow-all`
            ViewerProtocolPolicy: redirect-to-https
          ## The certificate to use when viewers use HTTPS to request objects.
          ViewerCertificate:
            #AcmCertificateArn: arn:aws:acm:us-east-1:038612146925:certificate/120b9eda-8468-49cb-a864-27d47a06f202 #-->uat
            AcmCertificateArn: arn:aws:acm:us-east-1:626569123605:certificate/264da02c-42e8-40c8-ad52-dd8aa33ba74b
            SslSupportMethod: sni-only
          ## Uncomment the following section in case you want to enable logging for CloudFront requests
          # Logging:
          #   IncludeCookies: 'false'
          #   Bucket: mylogs.s3.amazonaws.com
          #   Prefix: myprefix
  ## In order to print out the hosted domain via `serverless info` we need to define the DomainName output for CloudFormation
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [ WebAppCloudFrontDistribution, DomainName ]