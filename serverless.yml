service: poliza-express-hogar 

provider:
  name: aws
  runtime: nodejs8.10
  stage: dev
  region: us-east-1
  account: {Ref: "AWS::AccountId"}
  #iamRoleStatements:
  #      - Effect: "Allow"
  #        Action:
  #          - s3:*
  #        Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
          
custom:
  s3Bucket: poliza-express-hogar-dev
  s3BucketPDF: poliza-express-hogar-pdf-dev
  
package:
  include:
   # - .git/**
  exclude:
  #  - .git/**
  excludeDevDependencies: true

functions:
  hogar:
    handler: handler.hogar

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html  
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
            #- Sid: AllowPublicRead
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
              - "s3:GetObject"
              - "s3:PutObject"
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
    PdfS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketPDF}
        AccessControl: PublicReadWrite
    PdfS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: PdfS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
            #- Sid: AllowPublicReadWrite
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
              - "s3:GetObject"
              - "s3:PutObject"
              Resource: arn:aws:s3:::${self:custom.s3BucketPDF}/*
    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}"          
    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              Id: WebApp
              S3OriginConfig:
                 OriginAccessIdentity: { "Fn::Join" : ["",["origin-access-identity/cloudfront/", {Ref: WebsiteOriginAccessIdentity } ] ] }
          Enabled: 'true'
          Aliases:
           - hogar-dev.libertyseguros.co
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
            #- ErrorCode: 403
              #ResponseCode: 200
              #ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            MinTTL: 0  
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            #AcmCertificateArn: arn:aws:acm:us-east-1:038612146925:certificate/8ee09741-2365-4154-a78e-73e9ae532809
            AcmCertificateArn: arn:aws:acm:us-east-1:710809157942:certificate/e4b7e1ca-e779-4489-99c6-bb6ff36b2e4f
            SslSupportMethod: sni-only
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [ WebAppCloudFrontDistribution, DomainName ]
