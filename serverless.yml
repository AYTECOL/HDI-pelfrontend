service: poliza-express-hogar

custom:
  default_stage: nonprod
  s3Bucket: poliza-express-hogar
  s3BucketPDF: poliza-express-hogar-pdf-nonprod

provider:
  name: aws
  runtime: nodejs8.10
  stage: nonprod
  region: us-east-1
  account: { Ref: "AWS::AccountId" }
  Tags:
  # Set Tags for Resource
  stackTags:
    lm_troux_uid: B1E58FE2-E5A2-4A00-98DD-7B42BFF29677
    lm_app: "CO_HOME_AWS"
    lm_app_env: ${self:custom.stage}
    lm_sbu: INTL
    intl_country: co
    intl_region: latam
  iamRoleStatements:
      - Effect: "Allow"
        Action:
          - s3:PutItem
        Resource: arn:aws:s3:::${self:custom.s3Bucket}/*

package:
  include:
  # - .git/**
  exclude:
  #  - .git/**
  excludeDevDependencies: true

functions:
  hogar:
    handler: handler.hogar

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
    PdfS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketPDF}
        AccessControl: PublicReadWrite
    PdfS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: PdfS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
                - "s3:*"
              Resource: arn:aws:s3:::${self:custom.s3BucketPDF}/*
    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}"
    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        Tags:
            -
              Key: Name
              Value: CloudFrontLibertyBucket
            -
              Key: lm_troux_uid
              Value: B1E58FE2-E5A2-4A00-98DD-7B42BFF29677
            -
              Key: lm_app
              Value: 'CO_HOME_AWS'
            -
              Key: lm_app_env
              Value: nonprod
            -
              Key: lm_sbu
              Value: INTL
            -
              Key: intl_country
              Value: co
            -
              Key: intl_region
              Value: latam  
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              Id: WebApp
              S3OriginConfig:
                OriginAccessIdentity: { "Fn::Join" : ["",["origin-access-identity/cloudfront/", {Ref: WebsiteOriginAccessIdentity } ] ] }
          Enabled: 'true'
          Aliases:
            - hogar-uat.libertyseguros.co
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 1
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            MinTTL: 3600
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            #Certificado DEV:AcmCertificateArn: arn:aws:acm:us-east-1:710809157942:certificate/e4b7e1ca-e779-4489-99c6-bb6ff36b2e4f
            #Certificado NONPROD: 
            AcmCertificateArn: arn:aws:acm:us-east-1:038612146925:certificate/8ee09741-2365-4154-a78e-73e9ae532809
            #Certificado PROD:AcmCertificateArn: arn:aws:acm:us-east-1:626569123605:certificate/38597742-833f-4356-9a6d-8357c61e5159
            MinimumProtocolVersion: TLSv1.2_2018
            SslSupportMethod: sni-only
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [ WebAppCloudFrontDistribution, DomainName ]
