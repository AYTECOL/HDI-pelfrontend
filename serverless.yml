
service: poliza-express-hogar 

provider:
  name: aws
  runtime: nodejs8.10
  stage: dev 
  region: us-east-1
  account: {Ref: "AWS::AccountId"}
  iamRoleStatements:
        - Effect: "Allow"
          Action:
            - s3:PutItem
            - s3:List*
          Resource: arn:aws:s3:::${self:custom.s3Bucket}/*

custom:
  s3Bucket: poliza-express-hogar-front

functions:
  hello:
    handler: handler.hello

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: error.html
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
              CanonicalUser:
                    {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
              - s3:GetObject
              - s3:PutObject
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}"          
    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              Id: WebApp
              S3OriginConfig:
                 OriginAccessIdentity: { "Fn::Join" : ["",["origin-access-identity/cloudfront/", {Ref: WebsiteOriginAccessIdentity } ] ] }
          Enabled: 'true'
          Aliases:
           - hogar-dev.libertyseguros.co
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            AcmCertificateArn: arn:aws:iam::710809157942:server-certificate/AWSDEVEXT.LIBERTYCOLOMBIA.COM.CO_SAN_2018
            SslSupportMethod: sni-only
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [ WebAppCloudFrontDistribution, DomainName ]