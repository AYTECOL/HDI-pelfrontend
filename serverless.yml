service: poliza-express-hogar

provider:
  name: aws
  runtime: nodejs12.x
  stage: dev
  region: us-east-1
  account: { Ref: "AWS::AccountId" }
  Tags:
  # Set Tags for Resource
  stackTags:
    lm_troux_uid: B1E58FE2-E5A2-4A00-98DD-7B42BFF29677
    lm_app: "CO_HOME_AWS"
    lm_app_env: ${self:provider.stage}
    lm_sbu: INTL
    intl_country: co
    intl_region: latam
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - s3:PutObject
        - s3:PutObjectAcl
        - s3:GetObject
        - s3:GetObjectAcl
      Resource: 
        - "arn:aws:s3:::${self:custom.s3Bucket}/*"
        - "arn:aws:s3:::${self:custom.s3Bucket}"

custom: ${file(./env/${self:provider.stage, 'dev'}.yml)}

package:
  include:
  # - .git/**
  exclude:
  #  - .git/**
  excludeDevDependencies: true

functions:
  hogar:
    handler: handler.hogar

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
    PdfS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketPDF}
        AccessControl: PublicReadWrite
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
              AllowedHeaders:
                - '*'
    PdfS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: PdfS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {"Fn::GetAtt": [ WebsiteOriginAccessIdentity , S3CanonicalUserId ]}
              Action:
                - "s3:*"
              Resource: arn:aws:s3:::${self:custom.s3BucketPDF}/*
    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: "CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}"
    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        Tags:
            -
              Key: Name
              Value: CloudFrontLibertyBucket
            -
              Key: lm_troux_uid
              Value: B1E58FE2-E5A2-4A00-98DD-7B42BFF29677
            -
              Key: lm_app
              Value: 'CO_HOME_AWS'
            -
              Key: lm_app_env
              Value: nonprod
            -
              Key: lm_sbu
              Value: INTL
            -
              Key: intl_country
              Value: co
            -
              Key: intl_region
              Value: latam  
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              Id: WebApp
              S3OriginConfig:
                OriginAccessIdentity: { "Fn::Join" : ["",["origin-access-identity/cloudfront/", {Ref: WebsiteOriginAccessIdentity } ] ] }
          Enabled: 'true'
          Aliases:
            - hogar-dev.libertyseguros.co
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 1
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            MinTTL: 3600
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.AcmCertificateArn}
            MinimumProtocolVersion: TLSv1.2_2018
            SslSupportMethod: sni-only
          WebACLId: ${self:custom.WebACLId}
          Logging:
             Bucket: ${self:custom.s3Bucket}.s3.amazonaws.com
             IncludeCookies: true
             Prefix: intl-co-logging-cloudfront-${self:service}-${self:provider.stage}
          HttpVersion: http2  
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [ WebAppCloudFrontDistribution, DomainName ]

