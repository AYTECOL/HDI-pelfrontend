service: poliza-express-hogar
custom: ${file(./env/${opt:stage, 'dev'}.yml)}
plugins:
  - serverless-plugin-resource-tagging
  - '@silvermine/serverless-plugin-cloudfront-lambda-edge'

provider:
  name: aws
  runtime: nodejs18.x
  deploymentBucket:
    name: ${self:custom.bucketDeployment}
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  tags: ${file(./tags.yml)}
  stackTags: ${file(./tags.yml)}
  iam:
    role:
      stataments:
        - Effect: 'Allow'
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:GetObject
            - s3:GetObjectAcl
          Resource:
            - 'arn:aws:s3:::${self:custom.s3Bucket}/*'
            - 'arn:aws:s3:::${self:custom.s3Bucket}'

package:
  include:
    - handler.js
  exclude:
    - node_modules/**

functions:
  hogar:
    name: ${self:service}-${self:provider.stage}-lambdaEdge
    handler: handler.infr
    role: { 'Fn::GetAtt': [LambdaIAMRole, Arn] }
    runtime: nodejs18.x
    MemorySize: 256
    timeout: 29
    lambdaAtEdge:
      distribution: 'WebAppCloudFrontDistribution'
      eventType: origin-response
      includeBody: false

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3Bucket}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {
                    'Fn::GetAtt':
                      [WebsiteOriginAccessIdentity, S3CanonicalUserId],
                  }
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
              Resource: arn:aws:s3:::${self:custom.s3Bucket}/*
    PdfS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketPDF}
        AccessControl: PublicReadWrite
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
              AllowedHeaders:
                - '*'
    PdfS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: PdfS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal:
                CanonicalUser:
                  {
                    'Fn::GetAtt':
                      [WebsiteOriginAccessIdentity, S3CanonicalUserId],
                  }
              Action:
                - 's3:GetObject'
              Resource: arn:aws:s3:::${self:custom.s3BucketPDF}/*
            - Sid: LambdaBackend
              Effect: Allow
              Principal: '*'
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
              Resource: 
                - arn:aws:s3:::${self:custom.s3BucketPDF}
                - arn:aws:s3:::${self:custom.s3BucketPDF}/*
              Condition:
                StringEquals:
                  aws:PrincipalArn:
                    Fn::Join:
                      - ''
                      - - 'arn:aws:iam::'
                        - Ref: AWS::AccountId
                        - ':role/libertyhome-${self:provider.stage}-${self:provider.region}-lambdaRole'

    WebsiteOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: 'CloudFrontOriginAccessIdentity for ${self:service}-${self:provider.stage}'
    LambdaIAMRole:
      Type: 'AWS::IAM::Role'
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: 'AllowLambdaServiceToAssumeRole'
              Effect: 'Allow'
              Action:
                - 'sts:AssumeRole'
              Principal:
                Service:
                  - 'lambda.amazonaws.com'
                  - 'edgelambda.amazonaws.com'
        Path: '/'
        ManagedPolicyArns:
          - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        PermissionsBoundary:
          Fn::Join:
            - ''
            - - 'arn:aws:iam::'
              - Ref: AWS::AccountId
              - ':policy/cloud-services/pb-lm-troux-uid-access'

    WebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.s3Bucket}.s3.amazonaws.com
              Id: WebApp
              S3OriginConfig:
                OriginAccessIdentity:
                  {
                    'Fn::Join':
                      [
                        '',
                        [
                          'origin-access-identity/cloudfront/',
                          { Ref: WebsiteOriginAccessIdentity },
                        ],
                      ],
                  }
          Enabled: 'true'
          Aliases: ${self:custom.Aliases}
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 1
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            MinTTL: 3600
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: 'false'
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.AcmCertificateArn}
            MinimumProtocolVersion: TLSv1.2_2018
            SslSupportMethod: sni-only
          WebACLId: ${self:custom.WebACLId}
          Logging:
            Bucket: ${self:custom.s3Bucket}.s3.amazonaws.com
            IncludeCookies: true
            Prefix: intl-co-logging-cloudfront-${self:service}-${self:provider.stage}
          HttpVersion: http2
          
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        'Fn::GetAtt': [WebAppCloudFrontDistribution, DomainName]
    cloudfrontId:
      Value: !Ref WebAppCloudFrontDistribution
