env:
  browser: true
extends:
  - eslint:recommended
  - plugin:prettier/recommended
  # - plugin:sonarjs/recommended
  - react-app
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
parserOptions:
  ecmaFeatures:
    jsx: true
  ecmaVersion: latest
  sourceType: module

plugins: ['prettier', 'sonarjs']

rules: { 'prettier/prettier': 'warn' }
